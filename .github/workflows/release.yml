name: CI with Submodules

on:
  push:
    branches:
      - develop2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          submodules: true # Inicializa y actualiza los submódulos
          ssh-key: ${{ secrets.SSH-PRIVATE-KEY }} # Necesario si tus submódulos son privados

      - name: enter to submodule
        run: cat ./apps/health/README.md
